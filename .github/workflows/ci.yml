name: Julia CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        julia-version: ['1.10', '1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Run tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'
